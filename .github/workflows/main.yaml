name: Build and Test

"on":
  push:
    branches:
    - '*'
    tags:
    - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: |
          make install-ci

      # Таблица результатов уходит в job summary, падения — аннотациями
      # на строках в diff. И то и другое пишут репортёры из jest.config.js.
      - name: Test
        id: test
        run: |
          make test
        continue-on-error: true

      - name: Upload Test Reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports
          if-no-files-found: warn
          retention-days: 14

      - name: Link Reports In Summary
        if: always() && steps.upload.outputs.artifact-url != ''
        run: |
          {
            echo ""
            echo "Полный HTML-отчёт и junit XML — в артефакте [test-reports](${{ steps.upload.outputs.artifact-url }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: steps.test.outcome == 'success'
        run: |
          make build
