name: Build and Test

"on":
  push:
    branches:
    - '*'
    tags:
    - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        name: Checkout

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: |
          make install-ci

      - name: Test
        id: test
        run: |
          make test
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports

      - name: Build
        if: steps.test.outcome == 'success'
        run: |
          make build
